name: Build

# Continuous verification: builds Folio on every push to dev/main and every PR, so a broken
# package.js or missing vendor file surfaces immediately instead of at release time. This never
# publishes anything — see release.yml for the tag-triggered draft release.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run vendor
      - run: npm run package

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path "dist/Folio-win32-x64/*" -DestinationPath "dist/Folio-win32-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Folio-win32-x64-${{ github.sha }}
          path: dist/Folio-win32-x64.zip
          retention-days: 14

      # Microsoft Store package (unsigned; the Store signs it on submission). Identity values are public and
      # come from repository variables once the app is reserved in Partner Center; placeholders until then.
      - name: Build MSIX
        shell: pwsh
        env:
          FOLIO_MSIX_NAME: ${{ vars.FOLIO_MSIX_NAME }}
          FOLIO_MSIX_PUBLISHER: ${{ vars.FOLIO_MSIX_PUBLISHER }}
          FOLIO_MSIX_PUBLISHER_DISPLAY: ${{ vars.FOLIO_MSIX_PUBLISHER_DISPLAY }}
        run: ./scripts/make-msix.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Folio-msix-${{ github.sha }}
          path: dist/Folio.msix
          retention-days: 14
